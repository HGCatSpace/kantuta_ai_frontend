<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D060"/>
      <stop offset="50%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#9A7209"/>
    </linearGradient>
  </defs>

  <!-- Base / pedestal -->
  <rect x="28" y="54" width="8" height="3" rx="1.5" fill="url(#gold)"/>
  <!-- Foot -->
  <rect x="22" y="57" width="20" height="3" rx="1.5" fill="url(#gold)"/>

  <!-- Vertical pole -->
  <rect x="30.5" y="14" width="3" height="42" rx="1.5" fill="url(#gold)"/>

  <!-- Top sphere -->
  <circle cx="32" cy="12" r="3.5" fill="url(#gold)"/>

  <!-- Horizontal beam -->
  <rect x="10" y="22" width="44" height="3" rx="1.5" fill="url(#gold)"/>

  <!-- Left chain -->
  <line x1="14" y1="25" x2="14" y2="36" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
  <!-- Right chain -->
  <line x1="50" y1="25" x2="50" y2="36" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>

  <!-- Left pan -->
  <path d="M7,36 Q14,42 21,36" fill="none" stroke="url(#gold)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Right pan -->
  <path d="M43,36 Q50,42 57,36" fill="none" stroke="url(#gold)" stroke-width="2.2" stroke-linecap="round"/>
</svg>
